<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Try Out - Teman Pelajar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fb;
            color: #333;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #eef2f7;
        }

        .header h1 {
            font-size: 24px;
            color: #1e3a8a;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #64748b;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .form-label span.required {
            color: #ef4444;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .provinsi-box {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 14px;
            background-color: #f8fafc;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .radio-item, .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 6px;
            transition: background-color 0.15s;
        }

        .radio-item:hover, .checkbox-item:hover {
            background-color: #e2e8f0;
        }

        .radio-item input[type="radio"],
        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        thead {
            background-color: #1e3a8a;
            color: #ffffff;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th.center, td.center {
            text-align: center;
        }

        tbody tr:hover {
            background-color: #f1f5f9;
        }

        .badge-kuota {
            display: inline-block;
            background-color: #dcfce7;
            color: #166534;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 13px;
        }

        .badge-habis {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .mapel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
        }

        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Form Pendaftaran Try Out</h1>
        <p>Silakan lengkapi data diri, sesi, dan mata pelajaran pilihan Anda</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="formPendaftaran">
        <!-- 1. Nama Siswa -->
        <div class="form-group">
            <label for="nama_siswa" class="form-label">1. Nama Siswa <span class="required">*</span></label>
            <input type="text" id="nama_siswa" name="nama_siswa" placeholder="Masukkan nama lengkap siswa" required>
        </div>

        <!-- 2. Provinsi Pilihan (38 Provinsi) -->
        <div class="form-group">
            <label class="form-label">2. Provinsi Asal (Pilih Satu) <span class="required">*</span></label>
            <div class="provinsi-box">
                <label class="radio-item"><input type="radio" name="provinsi" value="Aceh" required> Aceh</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Sumatera Utara"> Sumatera Utara</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Sumatera Barat"> Sumatera Barat</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Riau"> Riau</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Kepulauan Riau"> Kepulauan Riau</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Jambi"> Jambi</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Sumatera Selatan"> Sumatera Selatan</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Kepulauan Bangka Belitung"> Kepulauan Bangka Belitung</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Bengkulu"> Bengkulu</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Lampung"> Lampung</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="DKI Jakarta"> DKI Jakarta</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Jawa Barat"> Jawa Barat</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Banten"> Banten</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Jawa Tengah"> Jawa Tengah</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="DI Yogyakarta"> DI Yogyakarta</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Jawa Timur"> Jawa Timur</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Bali"> Bali</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Nusa Tenggara Barat"> Nusa Tenggara Barat</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Nusa Tenggara Timur"> Nusa Tenggara Timur</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Kalimantan Barat"> Kalimantan Barat</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Kalimantan Tengah"> Kalimantan Tengah</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Kalimantan Selatan"> Kalimantan Selatan</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Kalimantan Timur"> Kalimantan Timur</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Kalimantan Utara"> Kalimantan Utara</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Sulawesi Utara"> Sulawesi Utara</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Gorontalo"> Gorontalo</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Sulawesi Tengah"> Sulawesi Tengah</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Sulawesi Barat"> Sulawesi Barat</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Sulawesi Selatan"> Sulawesi Selatan</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Sulawesi Tenggara"> Sulawesi Tenggara</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Maluku"> Maluku</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Maluku Utara"> Maluku Utara</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Papua"> Papua</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Papua Barat"> Papua Barat</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Papua Selatan"> Papua Selatan</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Papua Tengah"> Papua Tengah</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Papua Pegunungan"> Papua Pegunungan</label>
                <label class="radio-item"><input type="radio" name="provinsi" value="Papua Barat Daya"> Papua Barat Daya</label>
            </div>
        </div>

        <!-- 3. Pilih Sesi Try Out (Checkbox dengan validasi Single Choice) -->
        <div class="form-group">
            <label class="form-label">3. Pilih Sesi Try Out (Pilih 1 Sesi) <span class="required">*</span></label>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="center" style="width: 80px;">Pilih</th>
                            <th>Sesi</th>
                            <th>Waktu</th>
                            <th class="center">Kuota Tersisa</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-sesi">
                        <tr>
                            <td colspan="4" class="center">Memuat data kuota sesi...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 4. Mapel Pilihan (3 Checkbox) -->
        <div class="form-group">
            <label class="form-label">4. Mapel Wajib / Pilihan (Boleh lebih dari satu) <span class="required">*</span></label>
            <div class="mapel-grid">
                <label class="checkbox-item">
                    <input type="checkbox" name="mapel_pilihan" value="Sejarah"> Sejarah
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="mapel_pilihan" value="Ekonomi"> Ekonomi
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="mapel_pilihan" value="Sosiologi"> Sosiologi
                </label>
            </div>
        </div>

        <!-- 5. Submit -->
        <button type="submit" id="btnSubmit" class="btn-submit">Daftar Try Out Sekarang</button>
    </form>
</div>

<script>
    const API_URL = '../api/index.php';
    const tabelSesi = document.getElementById('tabel-sesi');
    const formPendaftaran = document.getElementById('formPendaftaran');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    function tampilkanPesan(pesan, tipe) {
        alertBox.textContent = pesan;
        alertBox.className = 'alert ' + (tipe === 'success' ? 'alert-success' : 'alert-error');
        alertBox.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Ambil data kuota sesi dari API (Method GET)
    async function muatKuotaSesi() {
        try {
            const response = await fetch(API_URL);
            const result = await response.json();

            if (result.status === 'success') {
                tabelSesi.innerHTML = '';
                result.sesi.forEach(item => {
                    const kuota = parseInt(item.kuota_tersisa);
                    const isHabis = kuota <= 0;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="center">
                            <input type="checkbox" class="sesi-checkbox" name="sesi_dipilih" value="${item.nama_sesi}" ${isHabis ? 'disabled' : ''}>
                        </td>
                        <td>${item.nama_sesi}</td>
                        <td>${item.waktu}</td>
                        <td class="center">
                            <span class="badge-kuota ${isHabis ? 'badge-habis' : ''}">
                                ${isHabis ? 'Penuh (0)' : kuota}
                            </span>
                        </td>
                    `;
                    tabelSesi.appendChild(tr);
                });

                // Pasang logika Single-Choice pada checkbox sesi
                pasangEventCheckboxSesi();
            }
        } catch (error) {
            tabelSesi.innerHTML = '<tr><td colspan="4" class="center">Gagal memuat kuota sesi dari server.</td></tr>';
        }
    }

    // Opsi 2: Tetap Checkbox, tetapi dibatasi otomatis maksimal 1 sesi yang dicentang
    function pasangEventCheckboxSesi() {
        const checkboxes = document.querySelectorAll('.sesi-checkbox');
        checkboxes.forEach(cb => {
            cb.addEventListener('change', function () {
                if (this.checked) {
                    checkboxes.forEach(otherCb => {
                        if (otherCb !== this) {
                            otherCb.checked = false;
                        }
                    });
                }
            });
        });
    }

    // Kirim data pendaftaran ke API (Method POST)
    formPendaftaran.addEventListener('submit', async function (e) {
        e.preventDefault();

        const namaSiswa = document.getElementById('nama_siswa').value.trim();
        const provinsiEl = document.querySelector('input[name="provinsi"]:checked');
        const provinsi = provinsiEl ? provinsiEl.value : '';

        const sesiArr = Array.from(document.querySelectorAll('input[name="sesi_dipilih"]:checked')).map(cb => cb.value);
        const mapelArr = Array.from(document.querySelectorAll('input[name="mapel_pilihan"]:checked')).map(cb => cb.value);

        if (!namaSiswa || !provinsi || sesiArr.length === 0 || mapelArr.length === 0) {
            tampilkanPesan('Harap lengkapi nama, pilih provinsi, pilih 1 sesi try out, dan minimal 1 mapel!', 'error');
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Memproses Pendaftaran...';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nama_siswa: namaSiswa,
                    provinsi: provinsi,
                    sesi_dipilih: sesiArr,
                    mapel_pilihan: mapelArr
                })
            });

            const result = await response.json();

            if (response.ok && result.status === 'success') {
                tampilkanPesan(result.message, 'success');
                formPendaftaran.reset();
                await muatKuotaSesi();
            } else {
                tampilkanPesan(result.message || 'Gagal menyimpan pendaftaran.', 'error');
            }
        } catch (error) {
            tampilkanPesan('Terjadi kesalahan koneksi ke server API.', 'error');
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Daftar Try Out Sekarang';
        }
    });

    muatKuotaSesi();
</script>

</body>
</html>
